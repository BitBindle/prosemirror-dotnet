name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: false

      - name: Restore
        run: dotnet restore prosemirror-dotnet.sln

      - name: Build
        run: dotnet build prosemirror-dotnet.sln --no-restore --configuration Debug

      - name: Test
        run: dotnet test prosemirror-dotnet.sln --no-build --configuration Debug
