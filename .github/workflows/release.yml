name: Release

# Manually triggered. Major.minor come from <Version> in src/StepWise.ProseMirror.csproj;
# the patch number is the next free patch after the latest v<major>.<minor>.* tag.
on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release
  id-token: write # get a short-lived nuget.org API key with trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: false

      - name: Determine version
        id: version
        run: |
          project_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/StepWise.ProseMirror.csproj | head -n1)
          major_minor=$(echo "$project_version" | cut -d. -f1,2)
          if ! [[ "$major_minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read major.minor from <Version> in the csproj (got '$project_version')" >&2
            exit 1
          fi
          prefix="v${major_minor}."
          latest_patch=$(git tag --list "${prefix}*" \
            | sed -n "s/^${prefix//./\\.}\([0-9][0-9]*\)$/\1/p" \
            | sort -n | tail -n1)
          if [ -z "$latest_patch" ]; then patch=0; else patch=$((latest_patch + 1)); fi
          version="${major_minor}.${patch}"
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # nuget.org refuses a version that it already has. The check stops the workflow before it creates the tag.
      # The flat container returns 404 when the package ID does not exist yet. This is the case for the first release.
      - name: Check that nuget.org does not have the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://api.nuget.org/v3-flatcontainer/bitbindle.prosemirror/index.json"
          status="$(curl --silent --show-error --output versions.json --write-out '%{http_code}' "$url")"
          if [[ "$status" == 200 ]]; then
            if jq --exit-status --arg v "${VERSION,,}" '.versions | index($v)' versions.json > /dev/null; then
              echo "::error::nuget.org already has BitBindle.ProseMirror $VERSION."
              exit 1
            fi
          elif [[ "$status" != 404 ]]; then
            echo "::error::nuget.org returned HTTP $status for $url"
            exit 1
          fi

      - name: Restore
        run: dotnet restore prosemirror-dotnet.slnx

      - name: Test
        run: dotnet test --solution prosemirror-dotnet.slnx --no-restore --configuration Debug

      - name: Pack
        run: >
          dotnet pack src/StepWise.ProseMirror.csproj
          --configuration Release
          --output artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}.git
          -p:RepositoryCommit=${{ github.sha }}
          -p:RepositoryBranch=${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          --target "${{ github.sha }}"
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
          artifacts/*.nupkg

      # Trusted publishing. The action exchanges the OIDC token of the workflow for a short-lived API key.
      # The secret NUGET_USER holds the nuget.org user name (not the e-mail address) of the policy owner.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
